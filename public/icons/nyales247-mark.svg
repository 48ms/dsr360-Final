<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="nyalesDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="50%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="nyalesGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="25%" stopColor="#F59E0B" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="nyalesRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#D97706" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#F59E0B" stopOpacity="0.8" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="nyalesCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#F59E0B" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#F59E0B" stopOpacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="nyalesShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Shadow / Base Squircle -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="url(#nyalesDarkBg)"
    stroke="url(#nyalesRimGrad)"
    stroke-width="6"
    filter="url(#nyalesShadow)"
  />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#nyalesCenterGlow)" />

  <!-- Tactical Corner Accents (Subtle 1px Technical Grids) -->
  <path d="M 80 140 L 80 80 L 140 80" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 432 140 L 432 80 L 372 80" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 80 372 L 80 432 L 140 432" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 432 372 L 432 432 L 372 432" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Central Emblem: 24/7 Dynamic Monogram -->
  <!-- "2" Glyph -->
  <text
    x="170"
    y="275"
    font-family="'Inter', -apple-system, system-ui, sans-serif"
    font-size="160"
    font-weight="900"
    letter-spacing="-8"
    text-anchor="middle"
    fill="#FFFFFF"
  >2</text>

  <!-- "4" Glyph -->
  <text
    x="268"
    y="275"
    font-family="'Inter', -apple-system, system-ui, sans-serif"
    font-size="160"
    font-weight="900"
    letter-spacing="-8"
    text-anchor="middle"
    fill="url(#nyalesGoldGrad)"
  >4</text>

  <!-- Slash "/" Lightning Chevron Line -->
  <path
    d="M 335 155 L 305 325"
    stroke="url(#nyalesGoldGrad)"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- "7" Glyph -->
  <text
    x="385"
    y="275"
    font-family="'Inter', -apple-system, system-ui, sans-serif"
    font-size="150"
    font-weight="900"
    letter-spacing="-8"
    text-anchor="middle"
    fill="#FFFFFF"
  >7</text>

  <!-- Subtitle Pill: "NYALES" & "SALES OS" -->
  <rect x="120" y="345" width="272" height="42" rx="21" fill="#0F172A" stroke="#F59E0B" stroke-width="2" opacity="0.9" />
  <text
    x="256"
    y="372"
    font-family="'Inter', -apple-system, system-ui, sans-serif"
    font-size="20"
    font-weight="900"
    letter-spacing="6"
    text-anchor="middle"
    fill="url(#nyalesGoldGrad)"
  >NYALES 24/7</text>
</svg>
