<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" fill="none">
  <defs>
    <linearGradient id="hzBrutalistAmber" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Squircle on Left -->
  <g transform="translate(10, 10)">
    <rect width="120" height="120" rx="34" fill="#09090B" />
    
    <!-- Left Pillar -->
    <rect x="26" y="26" width="16" height="68" rx="6" fill="#FFFFFF" />
    
    <!-- Right Pillar -->
    <rect x="78" y="26" width="16" height="68" rx="6" fill="#FFFFFF" />
    
    <!-- Diagonal Dynamic Flow Bridge -->
    <path
      d="M32 32 L88 88"
      stroke="url(#hzBrutalistAmber)"
      stroke-width="14"
      stroke-linecap="round"
    />
    
    <!-- Subtle 24/7 Laser Dash -->
    <path
      d="M58 24 L62 96"
      stroke="#FBBF24"
      stroke-width="3"
      stroke-linecap="round"
      stroke-dasharray="7 5"
    />
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(150, 20)">
    <!-- Primary Wordmark -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="46" letter-spacing="-1.5" fill="#09090B">
      Nyales<tspan fill="#D97706">24/7</tspan>
    </text>

    <!-- Subtitle Lockup -->
    <text x="2" y="85" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" letter-spacing="2.5" fill="#71717A">
      ENGINEERED BY BIMA MAULANA SAPUTRA
    </text>

    <!-- Tagline Badge -->
    <rect x="2" y="96" width="230" height="18" rx="6" fill="#FEF3C7" />
    <text x="8" y="109" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="9" letter-spacing="0.5" fill="#92400E">
      B2B INDUSTRIAL SALES INTELLIGENCE OS
    </text>
  </g>
</svg>
