<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gearAmber" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="28" fill="#09090B" />

  <!-- 12-Hour / 24-Hour Calibrated Radial Tick Marks -->
  <g stroke="#3F3F46" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="16" x2="50" y2="22" />
    <line x1="50" y1="78" x2="50" y2="84" />
    <line x1="16" y1="50" x2="22" y2="50" />
    <line x1="78" y1="50" x2="84" y2="50" />
    <line x1="26" y1="26" x2="30" y2="30" />
    <line x1="70" y1="70" x2="74" y2="74" />
    <line x1="74" y1="26" x2="70" y2="30" />
    <line x1="26" y1="74" x2="30" y2="70" />
  </g>

  <!-- Industrial Gear Casing Outer Ring -->
  <circle cx="50" cy="50" r="24" stroke="url(#gearAmber)" stroke-width="4" />

  <!-- High-Precision 24/7 Clockwork Hands (Continuous Sales Execution) -->
  <path
    d="M50 50 L50 32"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M50 50 L64 50"
    stroke="#FBBF24"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Center Pivot Rivet -->
  <circle cx="50" cy="50" r="4" fill="#F59E0B" />
</svg>
