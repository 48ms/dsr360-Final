<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="helixAmber" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="obsidianGlow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>
  <!-- Background Pill / Canvas -->
  <rect width="100" height="100" rx="28" fill="url(#obsidianGlow)" />
  
  <!-- Continuous Viscous Helix 24/7 Loop -->
  <path
    d="M28 62 C22 52, 24 36, 36 28 C48 20, 62 24, 70 34 C78 44, 76 60, 64 68 C52 76, 38 72, 30 62"
    stroke="url(#helixAmber)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Inner Dynamic Speed Cut (Numeral 2/4 Intersection) -->
  <path
    d="M42 36 L58 50 L42 64 M58 36 V64"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Active 24/7 Pulse Beacon Dot -->
  <circle cx="70" cy="34" r="3.5" fill="#FBBF24" />
  <circle cx="70" cy="34" r="6" stroke="#FBBF24" stroke-width="1.2" opacity="0.4" />
</svg>
