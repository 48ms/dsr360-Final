<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="radarGold" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="28" fill="#09090B" />

  <!-- Orbit 1: Outer Scanning Perimeter -->
  <circle cx="50" cy="50" r="36" stroke="#27272A" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Orbit 2: Primary Sector Arc -->
  <path
    d="M 50 18 A 32 32 0 1 1 20 62"
    stroke="url(#radarGold)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Orbit 3: Inner Core Ring -->
  <circle cx="50" cy="50" r="16" stroke="#52525B" stroke-width="2" />

  <!-- 7 Pulse Territory Nodes (Representing 7 Days / 7 Key Factory Clusters) -->
  <circle cx="50" cy="18" r="3.5" fill="#F59E0B" />
  <circle cx="78" cy="34" r="2.5" fill="#FDE68A" />
  <circle cx="82" cy="54" r="2.5" fill="#F59E0B" />
  <circle cx="68" cy="76" r="2.5" fill="#D97706" />
  <circle cx="38" cy="80" r="2.5" fill="#F59E0B" />
  <circle cx="20" cy="62" r="3.5" fill="#FDE68A" />

  <!-- Central Intelligence Radar Hub (Bima Maulana / Hermes) -->
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="9" stroke="#F59E0B" stroke-width="1.2" opacity="0.6" />
</svg>
